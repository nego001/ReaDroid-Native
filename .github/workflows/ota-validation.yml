name: OTA manifest validation
on:
  push:
    branches: [feature/ota-seguro]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate signed manifests using disposable RSA test key
        run: python -m unittest discover -s tests -p 'test_ota_manifest.py' -v
