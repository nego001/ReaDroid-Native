name: SQLite native storage validation
on:
  push:
    branches: [validation/universal-core-u1-11-1, validation/universal-core-u1-11-2, validation/universal-core-u1-11-3, validation/universal-core-u1-11-4, validation/universal-core-u1-11-5, validation/universal-core-u1-12-1, validation/universal-core-u1-12-2, validation/universal-core-u1-12-3, validation/universal-core-u1-12-4, validation/universal-core-u1-12-5, validation/universal-core-u1-12-6, validation/universal-core-u1-final, validation/universal-core-u2-1-hex-parity, validation/universal-core-u2-2-jni, validation/universal-core-u2-3-android-build, validation/universal-core-u2-4-hex-fallback, validation/universal-core-u2-5-native-session, validation/universal-core-u2-6-final, validation/universal-core-u3-1-binary-pages, validation/universal-core-u3-2-hex-search, validation/universal-core-u3-3-text-encoding, validation/universal-core-u3-4-data-inspector, validation/universal-core-u3-5-binary-comparison, validation/universal-core-u3-6-virtual-overlay, validation/universal-core-u3-7-undo-redo, validation/universal-core-u3-8-final, validation/universal-core-u4-1-pe-structure, validation/universal-core-u4-2-elf-structure, validation/universal-core-u4-3-dex-structure, validation/universal-core-u4-4-elf-symbols, validation/universal-core-u4-4-pe-symbols, validation/universal-core-u4-4-dex-identifiers, validation/universal-core-u4-5-aarch64-decode, validation/universal-core-u4-5-aarch64-memory, validation/universal-core-u4-5-aarch64-arithmetic, validation/universal-core-u4-5-aarch64-bitfields, validation/universal-core-u4-5-aarch64-fp-simd, validation/universal-core-u4-5-aarch64-final, validation/universal-core-u4-5-a32-decode, validation/universal-core-u4-5-a32-register-memory, validation/universal-core-u4-5-a32-advanced, validation/universal-core-u4-5-a32-final, validation/universal-core-u4-5-thumb-decode, validation/universal-core-u4-5-thumb-register-memory, validation/universal-core-u4-5-thumb2-advanced, validation/universal-core-u4-5-thumb-it-state, validation/universal-core-u4-5-thumb-final, validation/universal-core-u4-5-x86-decode]
  pull_request:
    branches: [feature/p7-negrecodroid-visual-foundation]
    paths:
      - 'engine/storage/**'
      - 'engine/core/**'
      - '.github/workflows/storage-lock-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine/storage
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Fetch pinned storage dependencies
        run: cargo +1.85.1 fetch --locked
      - name: Native SQLite contract
        run: cargo +1.85.1 test --locked --offline
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
