name: SQLite native storage validation
on:
  push:
    branches: [validation/universal-core-u1-11-1, validation/universal-core-u1-11-2, validation/universal-core-u1-11-3, validation/universal-core-u1-11-4, validation/universal-core-u1-11-5, validation/universal-core-u1-12-1, validation/universal-core-u1-12-2, validation/universal-core-u1-12-3, validation/universal-core-u1-12-4, validation/universal-core-u1-12-5, validation/universal-core-u1-12-6, validation/universal-core-u1-final, validation/universal-core-u2-1-hex-parity, validation/universal-core-u2-2-jni, validation/universal-core-u2-3-android-build, validation/universal-core-u2-4-hex-fallback, validation/universal-core-u2-5-native-session]
  pull_request:
    branches: [feature/p7-negrecodroid-visual-foundation]
    paths:
      - 'engine/storage/**'
      - 'engine/core/**'
      - '.github/workflows/storage-lock-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine/storage
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Fetch pinned storage dependencies
        run: cargo +1.85.1 fetch --locked
      - name: Native SQLite contract
        run: cargo +1.85.1 test --locked --offline
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
