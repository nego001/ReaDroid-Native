name: Source checks
on:
  push:
    branches: [main, feature/v3-personalizacao, feature/ota-seguro, feature/v3-design-studio]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle.kts
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/readroid/app/MainActivity.java
          test -s app/src/main/java/com/readroid/app/ManifestInspector.java
          test -s app/src/main/java/com/readroid/app/SecurityScanner.java
          grep -q 'ManifestInspector.inspect' app/src/main/java/com/readroid/app/MainActivity.java
          grep -q 'SecurityScanner.scan' app/src/main/java/com/readroid/app/MainActivity.java
          for script in tools/*.py; do
            if [ -f "$script" ]; then python3 -m py_compile "$script"; fi
          done
          echo "Source layout and Python syntax checks passed"
      - name: Verify P7 reference validator with synthetic test PNGs
        run: python3 -m unittest discover -s tests -p 'test_p7_reference_assets.py' -v
      - name: Guard P7 screenshot documentation against stale evidence counts
        run: python3 -m unittest discover -s tests -p 'test_p7_reference_readme.py' -v
      - name: Verify committed-import history contract
        run: python3 -m unittest discover -s tests -p 'test_p7_import_history_contract.py' -v
      - name: Guard single-shell P7 screenshot capture
        run: |
          bash -n tools/p7_capture_populated.sh
          python3 -m unittest discover -s tests -p 'test_p7_capture_runner.py' -v
      - name: Protect major-only APK generation policy
        run: python3 -m unittest discover -s tests -p 'test_major_apk_policy.py' -v
