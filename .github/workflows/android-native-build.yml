name: Android native build laboratory
on:
  push:
    branches: [validation/universal-core-u2-3-android-build, validation/universal-core-u2-4-hex-fallback, validation/universal-core-u2-5-native-session, validation/universal-core-u2-6-final, validation/universal-core-u3-1-binary-pages, validation/universal-core-u3-2-hex-search, validation/universal-core-u3-3-text-encoding, validation/universal-core-u3-4-data-inspector, validation/universal-core-u3-5-binary-comparison, validation/universal-core-u3-6-virtual-overlay, validation/universal-core-u3-7-undo-redo, validation/universal-core-u3-8-final, validation/universal-core-u4-1-pe-structure, validation/universal-core-u4-2-elf-structure, validation/universal-core-u4-3-dex-structure, validation/universal-core-u4-4-elf-symbols, validation/universal-core-u4-4-pe-symbols, validation/universal-core-u4-4-dex-identifiers, validation/universal-core-u4-5-aarch64-decode, validation/universal-core-u4-5-aarch64-memory, validation/universal-core-u4-5-aarch64-arithmetic, validation/universal-core-u4-5-aarch64-bitfields, validation/universal-core-u4-5-aarch64-fp-simd, validation/universal-core-u4-5-aarch64-final, validation/universal-core-u4-5-a32-decode, validation/universal-core-u4-5-a32-register-memory, validation/universal-core-u4-5-a32-advanced, validation/universal-core-u4-5-a32-final, validation/universal-core-u4-5-thumb-decode, validation/universal-core-u4-5-thumb-register-memory, validation/universal-core-u4-5-thumb2-advanced, validation/universal-core-u4-5-thumb-it-state, validation/universal-core-u4-5-thumb-final, validation/universal-core-u4-5-x86-decode, validation/universal-core-u4-5-x86-modrm-sib, validation/universal-core-u4-5-x86-opcode-groups, validation/universal-core-u4-5-x86-operand-width, validation/universal-core-u4-5-x86-advanced, validation/universal-core-u4-5-x86-address-width, validation/universal-core-u4-5-x86-segment-prefix, validation/universal-core-u4-5-x86-lock-rep, validation/universal-core-u4-5-x86-shift-bit, validation/universal-core-u4-5-x86-atomic, validation/universal-core-u4-5-x86-mandatory-prefix, validation/universal-core-u4-5-x86-sse-xmm, validation/universal-core-u4-5-x86-sse2-integer, validation/universal-core-u4-5-x86-sse3-sse4, validation/universal-core-u4-5-x86-avx-vex, validation/universal-core-u4-5-x86-avx2, validation/universal-core-u4-5-x86-evex]
  pull_request:
    branches: [feature/p7-negrecodroid-visual-foundation]
    paths:
      - 'engine/android-bridge/**'
      - 'engine/core/**'
      - '.github/workflows/android-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK and pinned NDK
        uses: android-actions/setup-android@v4.0.3
        with:
          packages: 'ndk;27.2.12479018'
      - name: Verify Android SDK and pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add --toolchain 1.85.1 aarch64-linux-android x86_64-linux-android
          command -v sdkmanager
          sdkmanager --version
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          grep "^Pkg.Revision" "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          printf "U2_3_ANDROID_TOOLCHAIN_READY\n"
      - name: Build and inspect native libraries without packaging
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          bash engine/android-bridge/android/build.sh "$work"
