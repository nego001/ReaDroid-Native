name: V3 Android UI smoke
on:
  push:
    branches: [feature/v3-design-studio]
    paths:
      - '.github/workflows/v3-ui-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    if: github.ref == 'refs/heads/feature/v3-design-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Build and exercise real Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            python3 tools/android_ui_smoke.py
            test -s v3-studio-android-emulator.png
            echo 'AndroidRuntime verification is performed in android_ui_smoke.py'
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NegrescoDroid-V3-Android-Emulator-Screenshot
          path: |
            v3-studio-android-emulator.png
            v3-studio-android-hierarchy.xml
            v3-studio-android-runtime.txt
          if-no-files-found: warn
