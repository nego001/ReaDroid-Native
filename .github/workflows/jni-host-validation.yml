name: JNI host laboratory
on:
  push:
    branches: [validation/universal-core-u2-2-jni, validation/universal-core-u2-3-android-build, validation/universal-core-u2-4-hex-fallback, validation/universal-core-u2-5-native-session, validation/universal-core-u2-6-final, validation/universal-core-u3-1-binary-pages, validation/universal-core-u3-2-hex-search, validation/universal-core-u3-3-text-encoding, validation/universal-core-u3-4-data-inspector, validation/universal-core-u3-5-binary-comparison, validation/universal-core-u3-6-virtual-overlay, validation/universal-core-u3-7-undo-redo, validation/universal-core-u3-8-final, validation/universal-core-u4-1-pe-structure, validation/universal-core-u4-2-elf-structure, validation/universal-core-u4-3-dex-structure, validation/universal-core-u4-4-elf-symbols, validation/universal-core-u4-4-pe-symbols, validation/universal-core-u4-4-dex-identifiers]
  pull_request:
    branches: [feature/p7-negrecodroid-visual-foundation]
    paths:
      - 'engine/android-bridge/**'
      - 'engine/core/**'
      - '.github/workflows/jni-host-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust bridge locked tests
        working-directory: engine/android-bridge
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 fetch --locked
          cargo +1.85.1 test --locked --offline
          cargo +1.85.1 build --release --locked --offline
          git diff --exit-code -- Cargo.lock
      - name: Real JVM JNI calls
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/classes" "$work/headers"
          javac -encoding UTF-8 -h "$work/headers" -d "$work/classes" \
            engine/android-bridge/java/com/readroid/app/NativeHexBridge.java \
            engine/android-bridge/tests/java/NativeHexContract.java \
            app/src/main/java/com/readroid/app/ApkHexPreview.java \
            app/src/main/java/com/readroid/app/NativeHexBackend.java \
            engine/core/tests/java/BuildConfig.java \
            app/src/main/java/com/readroid/app/NativeHexSession.java \
            engine/android-bridge/tests/java/NativeHexSessionContract.java
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I"$work/headers" \
            engine/android-bridge/src/jni_hex.c \
            engine/android-bridge/target/release/libnegrodroid_jni_bridge.a \
            -ldl -lpthread -lm -o "$work/libnegrodroid_hex.so"
          java -Xcheck:jni -cp "$work/classes" com.readroid.app.NativeHexContract "$work/libnegrodroid_hex.so"
          java -Xcheck:jni -cp "$work/classes" com.readroid.app.NativeHexSessionContract
