name: Android APK
# Installable APK artifacts are created only for an explicitly approved
# major milestone. Pull requests continue using Source checks and P7 emulator
# testing, which build internally without publishing a downloadable installer.
on:
  workflow_dispatch:
    inputs:
      major_update_approved:
        description: 'Confirmar: esta entrega é uma atualização grande e aprovada para gerar APK?'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.major_update_approved == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fSL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept licenses and install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --stacktrace --no-daemon :app:assembleDebug
      - name: Verify APK signing and ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS="$SDK_ROOT/build-tools/35.0.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Build separate QA APK
        run: gradle --stacktrace --no-daemon :app:assembleQa
      - name: Verify QA identity and signing
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS="$SDK_ROOT/build-tools/35.0.0"
          APK="app/build/outputs/apk/qa/app-qa.apk"
          test -s "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee qa-badging.txt
          grep -q "package: name='com.readroid.app.qa'" qa-badging.txt
          grep -q "application-label:'NegrecoDroid V3 Teste'" qa-badging.txt
          sha256sum "$APK" | tee qa-apk-sha256.txt
      - name: Upload separate QA APK
        uses: actions/upload-artifact@v4
        with:
          name: NegrecoDroid-QA-Major-Update-${{ github.run_number }}
          path: |
            app/build/outputs/apk/qa/app-qa.apk
            qa-apk-sha256.txt
            qa-badging.txt
          if-no-files-found: error
