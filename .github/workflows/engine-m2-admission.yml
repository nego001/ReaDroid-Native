name: Engine M2 | Bounded APK analysis pipeline
on:
  push:
    branches: [feature/engine-m2-*]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-m2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-admission:
    name: ZIP and capacity Android ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assert import cannot bypass M2 gate
        run: |
          python3 -m unittest discover -s tests -p 'test_engine_m2_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_capacity_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_capacity_extractor.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_fingerprint_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_fingerprint_benchmark_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_fingerprint_extractor.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_primitive_fingerprint_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_pathlength_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_m2_pathlength_extractor.py' -v
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Validate hostile ZIP inputs with the real Android java.util.zip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.readroid.app.ApkArchiveSafetyInstrumentedTest,com.readroid.app.SafImportStreamInstrumentedTest,com.readroid.app.ApkReportBudgetInstrumentedTest,com.readroid.app.ApkCapacityProfileInstrumentedTest,com.readroid.app.ApkPathFingerprintInstrumentedTest,com.readroid.app.ApkPathBenchmarkInstrumentedTest,com.readroid.app.ApkPathBudgetInstrumentedTest,com.readroid.app.ApkPrimitiveFingerprintInstrumentedTest,com.readroid.app.ApkPathLengthProfileInstrumentedTest
            # connectedDebugAndroidTest can uninstall its app before returning.
            # Read narrow logcat filter; only validated synthetic JSON is kept.
            adb logcat -d -s M2Capacity:I M2Fingerprint:I '*:S' > m2-capacity-logcat.tmp
            python3 tools/extract_m2_capacity_logcat.py m2-capacity-logcat.tmp "m2-capacity-api-${{ matrix.api }}.json" ${{ matrix.api }}
            python3 tools/extract_m2_fingerprint_logcat.py m2-capacity-logcat.tmp "m2-fingerprint-api-${{ matrix.api }}.json" ${{ matrix.api }}
            rm -f m2-capacity-logcat.tmp
            # Three short, schema-validated profiles: 32, 128, 768 path chars.
            adb logcat -d -s M2PathLength:I '*:S' > m2-pathlength-logcat.tmp
            python3 tools/extract_m2_pathlength_logcat.py m2-pathlength-logcat.tmp "m2-pathlength-api-${{ matrix.api }}.json" ${{ matrix.api }}
            rm -f m2-pathlength-logcat.tmp
            # Print the validated small JSON for visible numerical evidence.
            python3 -m json.tool "m2-capacity-api-${{ matrix.api }}.json"
            python3 -m json.tool "m2-fingerprint-api-${{ matrix.api }}.json"
            python3 -m json.tool "m2-pathlength-api-${{ matrix.api }}.json"
      - name: Preserve test evidence, never test APK binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-m2-admission-test-report-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            m2-capacity-api-*.json
            m2-fingerprint-api-*.json
            m2-pathlength-api-*.json
          if-no-files-found: warn
