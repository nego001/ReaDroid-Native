name: PE Sandbox | Real Bubblewrap and Ghidra

on:
  push:
    branches:
      - feature/pe-bubblewrap-real-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pe-bwrap-smoke
  cancel-in-progress: true

jobs:
  sandbox-proof:
    name: Probe real namespace and run Ghidra 12.2
    runs-on: ubuntu-22.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PE-S1.45 reviewer Git checkout pin and safe contract tests (not native VM)
        run: |
          set -euo pipefail
          # Check a genuinely clean checkout BEFORE contract tests import
          # modules, and suppress __pycache__ instead of ignoring dirty paths.
          python3 -B tools/pe_arch_vm_checkout_pin.py \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-commit "$GITHUB_SHA" \
            > "$RUNNER_TEMP/pe-s1-45-local-git-pin.json"
          python3 - "$RUNNER_TEMP/pe-s1-45-local-git-pin.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          record = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert record["status"] == "LOCAL_GIT_CHECKOUT_PIN_MATCHED"
          assert record["expected_commit"] == sys.argv[2]
          assert record["checked_manifest_entries"] >= 25
          assert record["worktree_status_clean"] is True
          assert record["native_vm_or_kernel_verified"] is False
          assert record["git_authorship_or_signature_verified"] is False
          print("PE-S1.45 CI Git commit pin passed; this does NOT attest a native Arch VM.")
          PY
          if python3 -B tools/pe_arch_vm_checkout_pin.py \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-commit "ffffffffffffffffffffffffffffffffffffffff"; then
            echo "PE-S1.45 incorrect external Git pin was accepted" >&2
            exit 1
          fi
          echo "PE-S1.45 incorrect external Git pin rejected: PASS"
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_checkout_pin.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_handoff_review.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_custody_review.py' -v
          command -v ssh-keygen
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_witness_review.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_witness_trust_review.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_dual_control_review.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_observation.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_observation_review.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_end_to_end_review.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pe_arch_vm_s1_57_release_guard.py' -v
          # The actual Ubuntu host must NOT pass the native Arch VM gate.
          mkdir -p "$RUNNER_TEMP/pe-s1-52-refusal"
          chmod 700 "$RUNNER_TEMP/pe-s1-52-refusal"
          if python3 -B tools/pe_arch_vm_observation.py \
            --output-directory "$RUNNER_TEMP/pe-s1-52-refusal" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-source-commit "$GITHUB_SHA" \
            --reviewer-challenge 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef; then
            echo "Ubuntu host incorrectly accepted as an Arch VM" >&2
            exit 1
          fi
          test -z "$(find "$RUNNER_TEMP/pe-s1-52-refusal" -mindepth 1 -print -quit)"
          echo "PE-S1.52 real Ubuntu non-VM rejection PASS; no guest files produced."
      - name: Install Bubblewrap and Windows cross-compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap gcc-mingw-w64-x86-64 libseccomp2
          bwrap --version
          java -version
          for key in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns; do
            sysctl "$key" || true
          done
      - name: Download Ghidra 12.2 from official GitHub release with pinned SHA256
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra_12.2.zip"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip \
            --output "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" \
            | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ghidra_12.2_PUBLIC/support/analyzeHeadless"
      - name: Verify extracted Ghidra installation matches pinned official ZIP
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ghidra_12.2_PUBLIC" "$RUNNER_TEMP/ghidra_12.2.zip" <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("tools").resolve()))
          from pe_ghidra_integrity import verify_pinned_ghidra_tree

          install, archive = map(Path, sys.argv[1:3])
          from pe_ghidra_integrity import GhidraIntegrityError

          proof = verify_pinned_ghidra_tree(install, archive)
          assert proof["verified"] is True
          assert proof["matched_files"] >= 100
          print("Pinned official Ghidra ZIP and all extracted files: PASS")
          print(json.dumps(proof, sort_keys=True))

          # Test a real tamper against the full genuine release. Restore the
          # tree even on an assertion failure, then reattest before launching.
          intruder = install / ".negresco-unlisted-synthetic-test"
          assert not intruder.exists()
          try:
              intruder.write_text("synthetic-unlisted-test-file", encoding="utf-8")
              try:
                  verify_pinned_ghidra_tree(install, archive)
              except GhidraIntegrityError as exc:
                  assert "Unlisted or missing" in str(exc), str(exc)
                  print("Real extracted-tree injection correctly rejected: PASS")
              else:
                  raise AssertionError("Tampered Ghidra tree was accepted")
          finally:
              intruder.unlink(missing_ok=True)
          clean = verify_pinned_ghidra_tree(install, archive)
          assert clean == proof
          print("Ghidra tree reverified after tamper test: PASS")
          PY
      - name: Compile harmless nonexecuting PE fixture
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc -O0 -g0 \
            tests/fixtures/pe_headless_smoke.c -o "$RUNNER_TEMP/pe_sandbox_fixture.exe"
          python3 tools/pe_auto_inventory.py "$RUNNER_TEMP/pe_sandbox_fixture.exe" \
            > "$RUNNER_TEMP/pe_inventory_sandbox.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["format"]=="PE32+" and r["architecture"]=="x86_64"' \
            "$RUNNER_TEMP/pe_inventory_sandbox.json"
      - name: Verify real Bubblewrap mounts, host home isolation and network namespace
        run: |
          set -euo pipefail
          marker="$HOME/.negresco-bwrap-host-canary-$GITHUB_RUN_ID"
          printf 'synthetic-marker' > "$marker"
          chmod 600 "$marker"
          trap 'rm -f "$marker"' EXIT
          python3 - "$RUNNER_TEMP/ghidra_12.2_PUBLIC" "$RUNNER_TEMP/pe_sandbox_fixture.exe" "$marker" <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          sys.path.insert(0, str(Path("tools").resolve()))
          from pe_ghidra_sandbox import build_command

          ghidra, fixture, canary = map(Path, sys.argv[1:])
          with tempfile.TemporaryDirectory(prefix="negresco-bwrap-probe-") as root:
              workspace = Path(root)
              (workspace / "scripts").mkdir(mode=0o700)
              shutil.copyfile("tools/ghidra_scripts/NegrescoFunctionInventory.java",
                              workspace / "scripts/NegrescoFunctionInventory.java")
              shutil.copyfile("tools/ghidra_scripts/NegrescoDeepPreview.java",
                              workspace / "scripts/NegrescoDeepPreview.java")
              shutil.copyfile(fixture, workspace / "input.exe")
              (workspace / "project").mkdir(mode=0o700)
              shutil.copyfile("tests/pe_sandbox_probe.py",
                              workspace / "pe_sandbox_probe.py")
              argv = build_command(ghidra, workspace, 120, deep_preview=True)
              boundary = argv.index("--")
              # Keep a real secret-bearing host FD intentionally inheritable
              # in the parent, then prove the sandbox process cannot see its
              # device/inode identity. This tests the actual process boundary.
              host_fd = os.open(canary, os.O_RDONLY)
              try:
                  os.set_inheritable(host_fd, True)
                  host_stat = os.fstat(host_fd)
                  argv = argv[:boundary+1] + [
                      "/usr/bin/python3", "/work/pe_sandbox_probe.py",
                      os.readlink("/proc/self/ns/net"), str(canary),
                      str(host_stat.st_dev), str(host_stat.st_ino)]
                  result = subprocess.run(argv, capture_output=True,
                                          text=True, timeout=35, check=False,
                                          close_fds=True)
              finally:
                  os.close(host_fd)
              print((result.stdout + result.stderr)[:4000])
              import json
              if result.returncode != 0:
                  raise RuntimeError("REAL BUBBLEWRAP PROBE FAILED CLOSED")
              payload = json.loads(result.stdout.strip())
              if (payload.get("isolation_probe") != "passed"
                      or payload.get("inherited_host_fd_hidden") is not True):
                  raise RuntimeError(
                      "REAL BUBBLEWRAP FD/NAMESPACE PROBE FAILED CLOSED")
          PY
      - name: PE-S1.43 actual read-only bind source policy (no mocks, synthetic Python only)
        run: |
          set -euo pipefail
          python3 tests/pe_readonly_mount_real_ci.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            > "$RUNNER_TEMP/pe-s1-43-real-mount.jsonl"
          python3 - "$RUNNER_TEMP/pe-s1-43-real-mount.jsonl" <<'PY'
          import json
          from pathlib import Path
          import sys
          records = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.strip().startswith("{")]
          assert len(records) == 4, "missing actual Bubblewrap mount probes"
          expected = [
              "PASS_ACTUAL_RO_BIND",
              "REJECTED_ACTUAL_RW_BIND",
              "REJECTED_ACTUAL_NESTED_RW_BIND",
              "PASS_PE_S1_43_ACTUAL_BWRAP_READONLY_MOUNT_POLICY",
          ]
          assert [record["status"] for record in records] == expected
          summary = records[-1]
          assert summary["mount_tests"] == 3
          assert summary["actual_readonly_bind_accepted"] is True
          assert summary["actual_writable_bind_rejected"] is True
          assert summary["actual_nested_writable_bind_rejected"] is True
          assert summary["fstatvfs_mocked"] is False
          assert summary["native_arch_vm_attestation"] is False
          assert summary["windows_binary_executed"] is False
          print("PE-S1.43: actual kernel readonly mount PASS; writable mounts rejected.")
          print("This is Ubuntu Bubblewrap only; not an Arch VM or immutable-host proof.")
          PY
      - name: PE-S1.44 full offline receipt CLI on real readonly/writable Bubblewrap mounts
        run: |
          set -euo pipefail
          python3 tests/pe_readonly_receipt_real_ci.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            > "$RUNNER_TEMP/pe-s1-44-full-receipt.jsonl"
          python3 - "$RUNNER_TEMP/pe-s1-44-full-receipt.jsonl" <<'PY'
          import json
          from pathlib import Path
          import sys
          records = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.strip().startswith("{")]
          statuses = [
              "PASS_REAL_READONLY_FULL_RECEIPT",
              "REJECT_REAL_WRITABLE_FULL_RECEIPT",
              "REJECT_REAL_NESTED_WRITABLE_FULL_RECEIPT",
              "REJECT_REAL_READONLY_TAMPERED_SOURCE",
              "REJECT_REAL_READONLY_WRONG_PIN",
              "REJECT_REAL_READONLY_WRONG_CHALLENGE",
              "PASS_PE_S1_44_REAL_READONLY_FULL_RECEIPT",
          ]
          assert len(records) == len(statuses), "missing real full receipt probes"
          assert [record.get("status") for record in records] == statuses
          for record in records[:-1]:
              assert record["source_manifest_files"] >= 20
              assert record["external_pin_provided_separately"] is True
              assert record["fstatvfs_mocked"] is False
              assert record["synthetic_self_asserted_report"] is True
              assert record["windows_binary_executed"] is False
              assert record["independent_arch_vm_attestation"] is False
          assert records[0]["cli_exit_code"] == 0
          assert all(record["cli_exit_code"] == 2 for record in records[1:-1])
          summary = records[-1]
          assert summary["cases"] == 6
          assert summary["real_readonly_receipt_approved"] is True
          assert summary["real_writable_source_rejected"] is True
          assert summary["real_nested_writable_source_rejected"] is True
          assert summary["real_readonly_tampered_source_rejected"] is True
          assert summary["real_wrong_external_pin_rejected"] is True
          assert summary["real_wrong_challenge_rejected"] is True
          assert summary["fstatvfs_mocked"] is False
          assert summary["native_arch_vm_attestation"] is False
          assert summary["windows_binary_executed"] is False
          print("PE-S1.44: real readonly full offline receipt CLI PASS; all negative cases fail closed.")
          print("Fixture report is self-asserted: NOT native Arch VM/kernel attestation.")
          PY
      - name: PE-S1.47 verify real readonly operator handoff with two external SHA pins
        run: |
          set -euo pipefail
          python3 -B tests/pe_readonly_receipt_real_ci.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            --run-handoff > "$RUNNER_TEMP/pe-s1-47-real-handoff.jsonl"
          python3 - "$RUNNER_TEMP/pe-s1-47-real-handoff.jsonl" <<'PY'
          import json
          from pathlib import Path
          import sys
          records = [json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines()
                     if x.strip().startswith("{")]
          expected = [
              "PASS_REAL_READONLY_OPERATOR_HANDOFF",
              "REJECT_REAL_WRONG_OPERATOR_HASH",
              "REJECT_REAL_PINNED_OPERATOR_REPORT_MISMATCH",
              "PASS_PE_S1_47_REAL_READONLY_HANDOFF",
          ]
          assert [entry.get("status") for entry in records] == expected
          assert len(records) == 4
          for item in records[:3]:
              assert item["source_manifest_files"] >= 25
              assert item["actual_readonly_mount"] is True
              assert item["git_real_checkout"] is True
              assert item["operator_hash_external"] is True
              assert item["receipt_hash_external"] is True
              assert item["fstatvfs_mocked"] is False
              assert item["self_reported_synthetic_fixture"] is True
              assert item["native_arch_vm_attestation"] is False
              assert item["windows_binary_executed"] is False
          assert records[0]["exit_code"] == 0
          assert records[1]["exit_code"] == 2
          assert records[2]["exit_code"] == 2
          final = records[-1]
          assert final["cases"] == 3
          assert final["real_readonly_handoff_accepted"] is True
          assert final["wrong_operator_pin_rejected"] is True
          assert final["operator_report_mismatch_rejected"] is True
          assert final["git_real_checkout"] is True
          assert final["fstatvfs_mocked"] is False
          assert final["native_arch_vm_attestation"] is False
          print("PE-S1.47: real readonly two-pin handoff PASS (synthetic claims only).")
          PY
      - name: PE-S1.48 four-artifact local custody package under real readonly Bubblewrap
        run: |
          set -euo pipefail
          python3 -B tests/pe_readonly_receipt_real_ci.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            --run-custody > "$RUNNER_TEMP/pe-s1-48-real-custody.jsonl"
          python3 - "$RUNNER_TEMP/pe-s1-48-real-custody.jsonl" <<'PY'
          import json
          from pathlib import Path
          import sys
          records = [json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines()
                     if x.strip().startswith("{")]
          expected = [
              "PASS_REAL_READONLY_FOUR_ARTIFACT_CUSTODY",
              "REJECT_REAL_WRONG_CUSTODY_INDEX_PIN",
              "REJECT_REAL_MODIFIED_GUEST_KERNEL_LOG",
              "PASS_PE_S1_48_REAL_READONLY_CUSTODY",
          ]
          assert [entry.get("status") for entry in records] == expected
          assert len(records) == 4
          for item in records[:3]:
              assert item["source_manifest_files"] >= 25
              assert item["actual_readonly_mount"] is True
              assert item["four_artifacts"] is True
              assert item["git_real_checkout"] is True
              assert item["fstatvfs_mocked"] is False
              assert item["synthetic_guest_logs"] is True
              assert item["independent_arch_vm_attestation"] is False
              assert item["windows_binary_executed"] is False
          assert records[0]["cli_exit_code"] == 0
          assert records[1]["cli_exit_code"] == 2
          assert records[2]["cli_exit_code"] == 2
          summary = records[-1]
          assert summary["cases"] == 3
          assert summary["real_custody_valid"] is True
          assert summary["external_index_sha256_mismatch_rejected"] is True
          assert summary["tampered_guest_log_rejected"] is True
          assert summary["fstatvfs_mocked"] is False
          assert summary["native_arch_vm_attestation"] is False
          assert summary["windows_binary_executed"] is False
          print("PE-S1.48: real four-artifact custody PASS; untrusted guest logs remain non-attestation.")
          PY
      - name: PE-S1.53 structured guest observation custody under real readonly Bubblewrap
        run: |
          set -euo pipefail
          python3 -B tests/pe_readonly_receipt_real_ci.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            --run-observation > "$RUNNER_TEMP/pe-s1-53-observation.jsonl"
          python3 - "$RUNNER_TEMP/pe-s1-53-observation.jsonl" <<'PY'
          import json
          from pathlib import Path
          import sys
          rows = [json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines()
                  if x.strip().startswith("{")]
          expected = [
              "PASS_REAL_READONLY_STRUCTURED_GUEST_CUSTODY",
              "REJECT_REAL_WRONG_OBSERVATION_INDEX_PIN",
              "REJECT_REAL_DIFFERENT_GUEST_OBSERVATION_BATCH",
              "PASS_PE_S1_53_REAL_READONLY_OBSERVATION_CUSTODY",
          ]
          assert [r.get("status") for r in rows] == expected
          assert len(rows) == 4
          for row in rows[:3]:
              assert row["source_manifest_files"] >= 25
              assert row["actual_readonly_mount"] is True
              assert row["git_real_checkout"] is True
              assert row["fstatvfs_mocked"] is False
              assert row["synthetic_operator_reports"] is True
              assert row["independent_arch_vm_attestation"] is False
              assert row["windows_binary_executed"] is False
          assert [r["cli_exit_code"] for r in rows[:3]] == [0, 2, 2]
          assert rows[-1]["cases"] == 3
          assert rows[-1]["rehashed_mismatched_batch_rejected"] is True
          assert rows[-1]["external_index_pin_mismatch_rejected"] is True
          assert rows[-1]["valid_structured_observation_accepted"] is True
          assert rows[-1]["fstatvfs_mocked"] is False
          assert rows[-1]["native_arch_vm_attestation"] is False
          print("PE-S1.53: real readonly structured observation correlation PASS; guest remains synthetic.")
          PY
      - name: PE-S1.55-57 real readonly signed review and mandatory release HOLD
        run: |
          set -euo pipefail
          python3 -B tests/pe_signed_readonly_real_ci.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
