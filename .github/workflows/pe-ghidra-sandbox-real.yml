          print("PE-S1.57: signed reviewer evidence accepted only as local proof; VM release HOLD: PASS")
          print("All observations SYNTHETIC; Ubuntu test is NOT independent Arch VM attestation.")
          PY
      - name: Exercise real seccomp BPF inside Bubblewrap (synthetic-only)
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ghidra_12.2_PUBLIC" "$RUNNER_TEMP/pe_sandbox_fixture.exe" <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          sys.path.insert(0, str(Path("tools").resolve()))
          from pe_ghidra_sandbox import build_command
          from pe_seccomp_filter import (
              attach_seccomp_fd, compile_seccomp_bpf_fd, seccomp_filter_count)
          ghidra, fixture = map(Path, sys.argv[1:])
          with tempfile.TemporaryDirectory(prefix="negresco-real-seccomp-") as temp:
              root = Path(temp)
              canary = root / "private-host-file"
              canary.write_text("synthetic host canary", encoding="utf-8")
              workspace = root / "work"
              (workspace / "scripts").mkdir(parents=True, mode=0o700)
              (workspace / "project").mkdir(mode=0o700)
              shutil.copyfile("tools/ghidra_scripts/NegrescoFunctionInventory.java",
                              workspace / "scripts/NegrescoFunctionInventory.java")
              shutil.copyfile("tests/pe_sandbox_probe.py",
                              workspace / "pe_sandbox_probe.py")
              shutil.copyfile(fixture, workspace / "input.exe")
              baseline = seccomp_filter_count()
              argv = build_command(ghidra, workspace, 120)
              fd = compile_seccomp_bpf_fd()
              host_fd = os.open(canary, os.O_RDONLY)
              try:
                  os.set_inheritable(host_fd, True)
                  identity = os.fstat(host_fd)
                  argv = attach_seccomp_fd(argv, fd)
                  boundary = argv.index("--")
                  argv = argv[:boundary + 1] + [
                      "/usr/bin/python3", "/work/pe_sandbox_probe.py",
                      os.readlink("/proc/self/ns/net"), str(canary),
                      str(identity.st_dev), str(identity.st_ino), str(baseline)]
                  result = subprocess.run(
                      argv, stdin=subprocess.DEVNULL, capture_output=True,
                      text=True, timeout=35, check=False, close_fds=True,
                      pass_fds=(fd,))
              finally:
                  os.close(host_fd)
                  os.close(fd)
              print((result.stdout + result.stderr)[:4000])
              if result.returncode != 0:
                  raise RuntimeError("REAL SECCOMP SANDBOX PROBE FAILED")
              record = json.loads(result.stdout.strip())
              assert record["isolation_probe"] == "passed"
              assert record["inherited_host_fd_hidden"] is True
              assert record["seccomp_enforced"] is True
              print("SECCOMP_DENY_PTRACE_AND_NAMESPACE_PROBE: PASS")
          PY
      - name: Real in-scope seccomp bridge, with cgroup verifier explicitly mocked
        run: |
          set -euo pipefail
          python3 tests/pe_scoped_seccomp_bridge_real_ci.py \
            "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            "$RUNNER_TEMP/pe_sandbox_fixture.exe" \
            > "$RUNNER_TEMP/bridge-real-mocked-cgroup.jsonl"
          python3 - "$RUNNER_TEMP/bridge-real-mocked-cgroup.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path
          records = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.startswith("{")]
          assert any(item.get("isolation_probe") == "passed"
                     and item.get("seccomp_enforced") is True
                     and item.get("inherited_host_fd_hidden") is True
                     and item.get("network_namespace_separate") is True
                     for item in records)
          assert any(item.get("status") == "PASS_REAL_BRIDGE_WITH_MOCKED_CGROUP"
                     and item.get("cgroup_enforcement_real") is False
                     and item.get("seccomp_and_bubblewrap_real") is True
                     for item in records)
          print("REAL FILTER/FD BRIDGE: PASS; CGROUP QUOTAS: MOCKED (NOT HOMOLOGATED)")
          PY
      - name: Run real Ghidra in REQUIRED Bubblewrap profile
        run: |
          set -euo pipefail
          python3 tools/pe_auto_ghidra.py "$RUNNER_TEMP/pe_sandbox_fixture.exe" \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            --output "$RUNNER_TEMP/real-bwrap-ghidra.json" \
            --deep-preview --timeout-seconds 420
      - name: Real Ghidra 12.2 with experimental seccomp (synthetic PE only)
        run: |
          set -euo pipefail
          python3 tools/pe_seccomp_ghidra_smoke.py \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            --ghidra-archive "$RUNNER_TEMP/ghidra_12.2.zip" \
            > "$RUNNER_TEMP/real-seccomp-ghidra-proof.json"
          python3 - "$RUNNER_TEMP/real-seccomp-ghidra-proof.json" <<'PY'
          import json, sys
          proof = json.load(open(sys.argv[1], encoding="utf-8"))
          assert proof["status"] == "PASS_REAL_GHIDRA_SECCOMP_SMOKE"
          assert proof["ghidra_12_2_pinned_install"] is True
          assert proof["ghidra_functions_discovered"] > 0
          assert proof["windows_binary_executed"] is False
          print("REAL GHIDRA 12.2 WITH EXPERIMENTAL SECCOMP: PASS")
          PY
      - name: Real Negresco runner with explicit --require-seccomp (synthetic PE)
        run: |
          set -euo pipefail
          python3 tools/pe_auto_ghidra.py "$RUNNER_TEMP/pe_sandbox_fixture.exe" \
            --ghidra-home "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            --output "$RUNNER_TEMP/real-bwrap-ghidra-seccomp.json" \
            --require-seccomp --timeout-seconds 420
          python3 - "$RUNNER_TEMP/real-bwrap-ghidra-seccomp.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          limitations = report["limitations"]
          assert limitations["seccomp_policy"] == "bwrap_narrow_cBPF_requested"
          assert limitations["os_sandbox"] == "bubblewrap_profile"
          assert limitations["resource_scope"] == "not_enforced"
          assert limitations["executable_launched"] is False
          assert report["evidence"]["total_discovered"] > 0
          print("PE RUNNER WITH EXPLICIT SECCOMP: PASS")
          PY
      - name: Real Ghidra decompilation through actual seccomp bridge (cgroup mocked)
        run: |
          set -euo pipefail
          python3 tests/pe_scoped_ghidra_bridge_real_ci.py \
            "$RUNNER_TEMP/ghidra_12.2_PUBLIC" \
            "$RUNNER_TEMP/ghidra_12.2.zip" \
            "$RUNNER_TEMP/pe_sandbox_fixture.exe" \
            > "$RUNNER_TEMP/real-ghidra-scoped-bridge.json"
          python3 - "$RUNNER_TEMP/real-ghidra-scoped-bridge.json" <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          lines = [line.strip() for line in raw.splitlines() if line.strip()]
          assert 1 <= len(lines) <= 20000, "missing or excessive bridge output"
          # Actual Ghidra logs on stdout precede the ONE final proof record.
          # Never treat logs as a pass. Require the final line to be JSON.
          proof = json.loads(lines[-1])
          assert isinstance(proof, dict)
          assert proof["status"] == "PASS_REAL_GHIDRA_BRIDGE_MOCKED_CGROUP_ONLY"
          assert proof["ghidra_pinned_release_verified"] is True
          assert proof["real_libseccomp_bpf"] is True
          assert proof["real_bubblewrap"] is True
          assert proof["real_ghidra_12_2"] is True
          assert proof["filter_created_by_actual_scoped_launcher"] is True
          runtime = proof["ghidra_jvm_seccomp_evidence"]
          assert runtime["verified"] is True
          assert runtime["measured_process"] == "ghidra_headless_jvm"
          assert runtime["measurement_source"] == "/proc/self/status"
          assert runtime["seccomp_mode"] == 2
          assert runtime["filters_in_ghidra"] > runtime["filters_before_bwrap"]
          assert runtime["additional_filters_observed"] >= 1
          assert proof["inventory_total_discovered"] > 0
          assert proof["decompiled_functions"] > 0
          assert proof["cgroup_verification"] == "MOCK_ONLY_NOT_HOMOLOGATED"
          assert proof["native_arch_vm_executed"] is False
          assert proof["windows_binary_executed"] is False
          print("REAL GHIDRA + REAL SECCOMP BRIDGE DECOMPILATION: PASS")
          print("SYSTEMD CGROUP/ARCH KERNEL: MOCKED OR UNTESTED, NOT HOMOLOGATED")
          PY
      - name: Check actual sandboxed Ghidra evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          sample = root / "pe_sandbox_fixture.exe"
          report = json.loads((root / "real-bwrap-ghidra.json").read_text())
          assert report["source_sha256"] == hashlib.sha256(sample.read_bytes()).hexdigest()
          assert report["architecture"] == "x86_64"
          assert report["limitations"]["os_sandbox"] == "bubblewrap_profile"
          assert report["limitations"]["executable_launched"] is False
          assert report["evidence"]["total_discovered"] >= 1
          functions = report["deep_preview"]["functions"]
          assert any(f["decompile_status"] == "ok" for f in functions)
          assert any(s["text"] == "negresco_evidence_2026.txt"
                     for f in functions if f["name"] == "inspect_path"
                     for s in f["strings"])
          assert any(f["name"] == "inspect_path" and f["computed_call_count"] >= 1
                     for f in functions)
          assert any(h["category"] == "filesystem_inspection"
                     for f in report["behavior_preview"]["functions"]
                     for h in f["hypotheses"])
          print("Ghidra 12.2 inside Bubblewrap: PASS",
                "functions=", report["evidence"]["total_discovered"],
                "decompiled=", len(functions),
                "network namespace / home / readonly JDK tested separately")
          PY
      - name: Retain sandbox profile and mocked Ghidra regression suites
        run: |
          python3 -m unittest discover -s tests -p 'test_pe_ghidra_sandbox.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_auto_ghidra.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_resource_limits.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_cgroup_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_resource_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_arch_cgroup_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_arch_descendant_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_arch_vm_validation.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_ghidra_integrity.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_seccomp_filter.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_seccomp_ghidra_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_scoped_seccomp_launcher.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_arch_scoped_seccomp_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_arch_scoped_ghidra_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_scoped_ghidra_bridge_real_ci.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_seccomp_runtime_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_scope_cleanup_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_pe_arch_vm_evidence.py' -v

  arch-userspace-contract:
    name: Arch Linux userspace | sandbox and cgroup contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Arch packages
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python bubblewrap util-linux libseccomp
          python --version
          bwrap --version
          cat /etc/os-release
      - name: Run profile and resource policy contracts as unprivileged user
        run: |
          set -euo pipefail
          runuser -u nobody -- python -m unittest discover -s tests -p 'test_pe_ghidra_sandbox.py' -v
          runuser -u nobody -- python -m unittest discover -s tests -p 'test_pe_resource_limits.py' -v
          runuser -u nobody -- python -m unittest discover -s tests -p 'test_pe_cgroup_guard.py' -v
