name: V3 Android 15 compatibility
on:
  push:
    branches: [feature/v3-design-studio]
    paths:
      - '.github/workflows/v3-android15-validation.yml'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'tools/android_ui_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-15-compat:
    if: github.ref == 'refs/heads/feature/v3-design-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Instrumentation and real UI on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "35"
            echo "Android version: $(adb shell getprop ro.build.version.release)"
            gradle --no-daemon :app:connectedDebugAndroidTest
            # Instrumentation cleanup may uninstall the target APK.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            python3 tools/android_ui_smoke.py
            test -s v3-studio-android-emulator.png
      - name: Upload Android 15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NegrescoDroid-V3-Android15-Validation
          path: |
            v3-studio-android-emulator.png
            v3-studio-android-hierarchy.xml
            v3-studio-android-runtime.txt
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
