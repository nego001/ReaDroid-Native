name: Universal Core validation
on:
  push:
    branches: [validation/universal-core-u1-1, validation/universal-core-u1-5, validation/universal-core-u1-6, validation/universal-core-u1-7, validation/universal-core-u1-8, validation/universal-core-u1-9, validation/universal-core-u1-9-2, validation/universal-core-u1-9-3, validation/universal-core-u1-10, validation/universal-core-u1-11, validation/universal-core-u1-11-1, validation/universal-core-u1-11-2, validation/universal-core-u1-11-3, validation/universal-core-u1-11-4]
  pull_request:
    branches: [feature/p7-negrecodroid-visual-foundation]
    paths:
      - 'engine/core/**'
      - '.github/workflows/universal-core-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-read-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine/core
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.85.1 fetch --locked
      - name: Run offline locked tests
        run: cargo +1.85.1 test --locked --offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exported JSON with independent consumer
        run: python tests/validate_report_json.py
      - name: Validate SQLite schema contract
        run: python tests/validate_index_schema.py
