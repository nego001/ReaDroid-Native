name: Universal Core validation
on:
  push:
    branches: [validation/universal-core-u1-1]
  pull_request:
    branches: [feature/p7-negrecodroid-visual-foundation]
    paths:
      - 'engine/core/**'
      - '.github/workflows/universal-core-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-read-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine/core
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      # Temporary dependency bootstrap ONLY on the isolated validation branch.
      # Commit the generated lock and remove this step before PR integration.
      - name: Resolve candidate lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/validation/universal-core-u1-1'
        run: cargo +1.85.1 generate-lockfile
      - name: Record candidate lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/validation/universal-core-u1-1' && runner.os == 'Linux'
        run: cat Cargo.lock
      - name: Fetch locked dependencies
        run: cargo +1.85.1 fetch --locked
      - name: Run offline locked tests
        run: cargo +1.85.1 test --locked --offline
