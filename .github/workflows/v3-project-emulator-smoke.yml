name: V3 APK and theme smoke
on:
  push:
    branches: [feature/v3-design-studio]
    paths:
      - 'tools/android_project_smoke.py'
      - '.github/workflows/v3-project-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-and-theme:
    if: github.ref == 'refs/heads/feature/v3-design-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test APK picker, file explorer and changing theme on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            python3 tools/android_project_smoke.py
      - name: Upload diagnostics and visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NegrescoDroid-V3-Project-And-Theme-Screenshots
          path: |
            v3-smoke-*.png
            v3-studio-android-hierarchy.xml
          if-no-files-found: warn
