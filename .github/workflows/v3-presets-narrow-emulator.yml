name: V3 preferences and narrow screens
on:
  push:
    branches: [feature/v3-design-studio]
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/v3-presets-narrow-emulator.yml'
      - 'tools/android_narrow_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preferences-and-layout:
    if: github.ref == 'refs/heads/feature/v3-design-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify presets on-device and narrow screen navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell wm size 320x640
            adb shell wm density 160
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.readroid.app || true
            python3 tools/android_narrow_smoke.py
      - name: Collect narrow-screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NegrescoDroid-V3-Narrow-Layout
          path: |
            v3-studio-narrow-*.png
            v3-studio-android-hierarchy.xml
          if-no-files-found: warn
