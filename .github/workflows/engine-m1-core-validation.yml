name: Engine M1 | APK transactional rebuild
on:
  push:
    branches: [feature/engine-*]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-regressions:
    name: Verified rebuild Android ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard real APK file actions before Android execution
        run: python3 -m unittest discover -s tests -p 'test_engine_file_actions_contract.py' -v
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Execute the real APK rebuild instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.readroid.app.ApkRebuilderInstrumentedTest
      - name: Preserve actual test reports, never installable APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-m1-rebuild-test-report-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn

  saf-edit-export:
    name: Real SAF edit-to-export Android 10
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard real APK file actions before Android execution
        run: python3 -m unittest discover -s tests -p 'test_engine_file_actions_contract.py' -v
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Open fixture, edit asset and verify unsigned SAF export
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/android_apk_edit_export_smoke.py
      - name: Preserve emulator evidence only (no APK redistribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-m1-saf-workflow-evidence-api29
          path: |
            v3-edit-*.png
            v3-edit-android-runtime.txt
          if-no-files-found: warn
